name: integration

# Live tests against real boxd machines: the langchain-tests standard suite,
# lifecycle and error tests, and a Deep Agents run with Claude. Manual only,
# because it needs the BOXD_API_KEY and ANTHROPIC_API_KEY repository secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: live tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group test --locked

      - name: Run integration tests
        run: make integration_tests
        env:
          BOXD_API_KEY: ${{ secrets.BOXD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
